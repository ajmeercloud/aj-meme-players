<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aj Meme Players - Meme Target Game</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffcf33, #ff6b9d, #9b5cff);
  min-height: 100vh;
  text-align: center;
  padding: 20px;
  color: #222;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 8px 25px #0003;
}

h1 {
  color: #873cff;
  margin-bottom: 10px;
}

h2 {
  margin: 20px 0;
}

.info {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin: 20px 0;
  font-size: 18px;
  font-weight: bold;
}

.target {
  font-size: 85px;
  margin: 25px;
}

button {
  background: #873cff;
  color: white;
  border: none;
  padding: 14px 30px;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #6125c5;
}
</style>
</head>

<body>

<div class="container">

  <h1>😂 AJ MEME PLAYERS</h1>
  <h2>🎯 Meme Target Game</h2>

  <p>Target par click karo aur points kamao!</p>

  <div class="info">
    <div>⭐ Score: 0</div>
    <div>⏱️ Time: 60</div>
  </div>

  <div class="target">😂</div>

  <button>Start Game</button>

</div>

</body>
</html>
