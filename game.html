
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aj Meme Players - Meme Target Game</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffcf33, #ff6b9d, #9b5cff);
  min-height: 100vh;
  text-align: center;
  padding: 20px;
  color: #222;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 25px;
  box-shadow: 0 8px 25px #0003;
}

h1 { color: #873cff; }
h2 { margin: 20px 0; }

.info {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin: 20px 0;
  font-size: 18px;
  font-weight: bold;
}

.target {
  font-size: 85px;
  margin: 25px;
  cursor: pointer;
  display: inline-block;
  user-select: none;
}

button {
  background: #873cff;
  color: white;
  border: none;
  padding: 14px 30px;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
}

button:hover { background: #6125c5; }

#message {
  margin: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <h1>😂 AJ MEME PLAYERS</h1>
  <h2>🎯 Meme Target Game</h2>

  <p>Target par click karo aur points kamao!</p>

  <div class="info">
    <div>⭐ Score: <span id="score">0</span></div>
    <div>⏱️ Time: <span id="time">60</span></div>
  </div>

  <div class="target" id="target">😂</div>

  <p id="message">Start button dabao aur khelo!</p>

  <button id="startBtn" onclick="startGame()">Start Game</button>
</div>

<script>
let score = 0;
let time = 60;
let timer;
let playing = false;

function startGame() {
  if (playing) return;

  score = 0;
  time = 60;
  playing = true;

  document.getElementById("score").textContent = score;
  document.getElementById("time").textContent = time;
  document.getElementById("message").textContent = "Game shuru! Target par click karo!";
  document.getElementById("startBtn").textContent = "Playing...";

  timer = setInterval(function() {
    time--;
    document.getElementById("time").textContent = time;

    if (time <= 0) {
      clearInterval(timer);
      playing = false;
      document.getElementById("message").textContent =
        "Game Over! Tumhara score: " + score;
      document.getElementById("startBtn").textContent = "Play Again";
    }
  }, 1000);
}

document.getElementById("target").addEventListener("click", function() {
  if (!playing) return;

  score++;
  document.getElementById("score").textContent = score;

  const memes = ["😂", "🤣", "😜", "😎", "🤪"];
  this.textContent = memes[Math.floor(Math.random() * memes.length)];
});
</script>

</body>
</html>
