
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aj Meme Players</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #10101c;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #19192b;
  padding: 22px;
  text-align: center;
}

header h1 {
  color: #a970ff;
  font-size: 30px;
}

header p {
  color: #ccc;
  margin-top: 8px;
}

.hero {
  text-align: center;
  padding: 65px 15px;
}

.hero h2 {
  font-size: 32px;
  color: #ffffff;
}

.hero p {
  margin: 15px 0;
  color: #bbb;
}

.btn {
  background: #873cff;
  color: white;
  border: none;
  padding: 13px 25px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.games {
  padding: 25px 15px;
  text-align: center;
}

.games h2 {
  color: #a970ff;
  margin-bottom: 25px;
}

.card {
  background: #202035;
  padding: 25px;
  border-radius: 12px;
  margin: 15px auto;
  max-width: 320px;
}

.card h3 {
  margin: 12px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
}
</style>
</head>

<body>

<header>
  <h1>🎮 AJ MEME PLAYERS</h1>
  <p>Play • Laugh • Enjoy</p>
</header>

<section class="hero">
  <h2>Welcome Gamers!</h2>
  <p>Play Funny Games With Meme Sounds</p>
  <button class="btn">Explore Games</button>
</section>

<section class="games">
  <h2>🔥 Our Games</h2>

  <div class="card">
    <h3>😂 Meme Games</h3>
    <p>Funny Characters and Sounds</p>
  </div>

  <div class="card">
    <h3>🏎️ Racing Games</h3>
    <p>Coming Soon</p>
  </div>

</section>

<footer>
  © 2026 AJ Meme Players
</footer>

</body>
</html>
